<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Pro DoubleClick</title>
	<link rel="stylesheet" href="popup.css">
</head>

<body>
	<div class="container">
		<div class="main-header">
			<div class="title-header">
				<img src="../asset/logo/icon_128.png" alt="Pro DoubleClick Icon" />
				<a target="_blank"
					href="https://microsoftedge.microsoft.com/addons/detail/pro-doubleclick/pgbkdhcaloojlampecdjnmpdffkkjkob"
					title="Go to Microsoft store">Pro
					DoubleClick</a>
			</div>
		</div>

		<div class="card-status">
			<div class="status-current">
				<img src="../asset/icon-svg/icon-default.svg" alt="Status Icon" width="16" height="16" />
				<div id="siteStatus">
					<span id="siteStatusTextOutput"></span>
				</div>
			</div>
		</div>

		<div class="new-card">
			<div class="section-title">Current Site</div>
			<div class="top-buttons">
				<div class="top-buttons-layout">
					<button id="siteBtnFront" class="site-btn site-btn-override">
						<svg class="MSicon">
							<use href="#FrontTab" />
						</svg>
					</button>
					<div class="button-name">Front Tab</div>
				</div>
				<div class="top-buttons-layout">
					<button id="siteBtnBack" class="site-btn site-btn-override">
						<svg class="MSicon">
							<use href="#BackTab" />
						</svg>
					</button>
					<div class="button-name">Back Tab</div>
				</div>
			</div>
		</div>

		<div class="new-card">
			<div class="section-title">Default</div>
			<div class="top-buttons">
				<div class="top-buttons-layout">
					<button id="globalBtnFront" class="site-btn site-btn-default">
						<svg class="MSicon">
							<use href="#FrontTab" />
						</svg>
					</button>
					<div class="button-name">Front Tab</div>
				</div>
				<div class="top-buttons-layout">
					<button id="globalBtnBack" class="site-btn site-btn-default">
						<svg class="MSicon">
							<use href="#BackTab" />
						</svg>
					</button>
					<div class="button-name">Back Tab</div>
				</div>
			</div>
		</div>

		<div class="card">
			<div class="icon-settings">
				<div class="button-layout">
					<button id="btnOption" class="action-btn">
						<img src="../asset/icon-svg/icon-option.svg" title="Site List" alt="Option Icon" width="20"
							height="20" />
					</button>
					option
				</div>
				<div class="button-layout">
					<button id="btnRemove" class="action-btn">
						<img src="../asset/icon-svg/icon-remove.svg" title="Remove Site rules" alt="Remove Icon"
							width="20" height="20" />
					</button>
					remove
				</div>
				<div class="button-layout">
					<button id="btnReset" class="action-btn">
						<img src="../asset/icon-svg/icon-reset.svg" title="Reset Defaults" alt="Reset Icon" width="20"
							height="20" />
					</button>
					reset
				</div>
				<div class="button-layout">
					<button id="btnFlag" class="action-btn">
						<img src="../asset/icon-svg/icon-block.svg" title="Block Site" alt="Block Icon" width="20"
							height="20" />
					</button>
					block
				</div>
			</div>
		</div>

		<div class="connect-section">
			<div class="icon-guide-bg">

				<a href="https://github.com/pranavxmeta/Pro-DoubleClick#-how-to-use" target="_blank"
					rel="noopener noreferrer" title="How-to Guide" aria-label="How-to Guide">
					<div class="icon-guide">
						<img src="../asset/icon-svg/icon-guide.svg" title="Guide" alt="Guide Icon" width="16"
							height="16" />
						<p>How-to</p>
					</div>
				</a>
			</div>
			<div class="social-icons">
				<a href="https://github.com/pranavxmeta" target="_blank" rel="noopener noreferrer" class="social-icon"
					title="GitHub" aria-label="GitHub Profile">
					<img src="../asset/icon-svg/icon-github.svg" title="GitHub" alt="GitHub" width="18" height="18" />
				</a>
			</div>
		</div>
	</div>

	<svg style="display: none">
		<symbol id="FrontTab" viewBox="0 0 24 24">
			<path
				d="M19.001 6.00977C20.6791 6.13743 22.001 7.5392 22.001 9.25V17.25C22.001 19.8734 19.8743 22 17.251 22H9.25098C7.5402 22 6.13942 20.6781 6.01172 19H7.52051C7.64192 19.8479 8.36945 20.5 9.25098 20.5H17.251C19.0459 20.5 20.501 19.0449 20.501 17.25V9.25C20.501 8.36847 19.8489 7.64095 19.001 7.51953V6.00977ZM14.75 2C16.5449 2 18 3.45507 18 5.25V14.75C18 16.5449 16.5449 18 14.75 18H5.25C3.45507 18 2 16.5449 2 14.75V5.25C2 3.45507 3.45507 2 5.25 2H14.75ZM3.5 14.75C3.5 15.7165 4.2835 16.5 5.25 16.5H14.75C15.7165 16.5 16.5 15.7165 16.5 14.75V7.5H3.5V14.75Z"
				fill="currentColor" />
		</symbol>
		<symbol id="BackTab" viewBox="0 0 24 24">
			<path
				d="M19.001 6.00977C20.6791 6.13743 22.001 7.5392 22.001 9.25V17.25C22.001 19.8734 19.8743 22 17.251 22H9.25098C7.5402 22 6.13942 20.6781 6.01172 19H7.52051C7.64192 19.8479 8.36945 20.5 9.25098 20.5H17.251C19.0459 20.5 20.501 19.0449 20.501 17.25V9.25C20.501 8.36847 19.8489 7.64095 19.001 7.51953V6.00977ZM14.75 2C16.5449 2 18 3.45507 18 5.25V14.75C18 16.5449 16.5449 18 14.75 18H5.25C3.45507 18 2 16.5449 2 14.75V5.25C2 3.45507 3.45507 2 5.25 2H14.75ZM3.5 14.75C3.5 15.7165 4.2835 16.5 5.25 16.5H14.75C15.7165 16.5 16.5 15.7165 16.5 14.75V7.5H3.5V14.75ZM5.25 3.5C4.2835 3.5 3.5 4.2835 3.5 5.25V6H16.5V5.25C16.5 4.2835 15.7165 3.5 14.75 3.5H5.25Z"
				fill="currentColor" />
		</symbol>
	</svg>

	<div id="slidingPanel" class="sliding-panel">
		<div class="panel-header">
			<button id="closePanelBtn" class="dismiss-btn">&lt; back</button>
		</div>
		<div class="panel-tabs">
			<button id="tabOverride" class="tab-btn active">Override</button>
			<button id="tabExcluded" class="tab-btn">Blocked</button>
		</div>
		<div id="panelList" class="panel-list"></div>
	</div>

	<script src="../scripts/popup.js"></script>
</body>

</html>
